<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Attendance Scanner</title>
  <meta name="description" content="Scan QR codes to log event attendance quickly and securely." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-start:   #0a0f1e;
      --bg-end:     #0d1b3e;
      --accent:     #6c63ff;
      --accent-2:   #a78bfa;
      --glass-bg:   rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-primary:   #f0f4ff;
      --text-muted:     #8b9ac0;
      --success:    #34d399;
      --error:      #f87171;
      --warn:       #fbbf24;
      --radius-lg:  20px;
      --radius-md:  12px;
      --shadow:     0 25px 50px rgba(0, 0, 0, 0.5);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated Background Orbs ──────────────────────────────── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: floatOrb 12s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: #6c63ff; top: -150px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: #a78bfa; bottom: -100px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 250px; height: 250px; background: #34d399; top: 50%; left: 60%; animation-delay: -8s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(40px) scale(1.08); }
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.7s ease both;
    }
    .header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108, 99, 255, 0.18);
      border: 1px solid rgba(108, 99, 255, 0.35);
      color: var(--accent-2);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .header .badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #e0d7ff 0%, var(--accent-2) 50%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 400;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
      padding: 28px;
      animation: fadeUp 0.7s ease 0.1s both;
    }

    /* ── Scanner wrapper ────────────────────────────────────────── */
    .scanner-wrapper {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
    }

    /* Corner brackets overlay */
    .scan-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .scan-corners::before, .scan-corners::after,
    .scan-corners .corner-br, .scan-corners .corner-bl {
      content: '';
      position: absolute;
      width: 30px; height: 30px;
      border-color: var(--accent-2);
      border-style: solid;
    }
    .scan-corners::before  { top: 14px;    left: 14px;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-corners::after   { top: 14px;    right: 14px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-corners .corner-bl { bottom: 14px; left: 14px;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-corners .corner-br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Scanning laser line */
    .scan-line {
      position: absolute;
      left: 14px; right: 14px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), var(--accent), transparent);
      border-radius: 1px;
      box-shadow: 0 0 12px var(--accent);
      z-index: 11;
      animation: scanLine 2.5s ease-in-out infinite;
      opacity: 0;
    }
    .scan-line.active { opacity: 1; }

    @keyframes scanLine {
      0%   { top: 20%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 80%; opacity: 0; }
    }

    /* Hide html5-qrcode default UI chrome ─────────────────────── */
    #reader { width: 100%; }
    #reader__header_message,
    #reader__status_span,
    #reader__dashboard_section_swaplink,
    #reader__filescan_input { display: none !important; }

    #reader__dashboard_section_csr__timeout_react { display: none !important; }

    #reader__dashboard { padding: 10px 0 0 !important; }

    #reader__camera_selection {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      padding: 8px 12px;
      margin-bottom: 10px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #reader__camera_selection:focus { border-color: var(--accent); }

    #html5-qrcode-button-camera-start,
    #html5-qrcode-button-camera-stop,
    #html5-qrcode-button-camera-permission {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin: 4px !important;
    }
    #html5-qrcode-button-camera-start:hover,
    #html5-qrcode-button-camera-stop:hover,
    #html5-qrcode-button-camera-permission:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }
    #html5-qrcode-button-camera-stop {
      background: rgba(248, 113, 113, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--error);
    }

    /* ── Status Banner ──────────────────────────────────────────── */
    .status-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      transition: background 0.4s, border-color 0.4s, transform 0.3s;
      min-height: 52px;
    }
    .status-banner.success {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.35);
    }
    .status-banner.error {
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.35);
    }
    .status-banner.logging {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .status-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .status-text { flex: 1; line-height: 1.4; }
    .status-text .label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
      display: block;
      margin-bottom: 2px;
    }

    /* ── Divider ────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 16px;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    /* ── Scan Count ─────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .stat-chip {
      flex: 1;
      text-align: center;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 8px;
    }
    .stat-chip .val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-2);
      display: block;
      line-height: 1;
    }
    .stat-chip .lbl {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
      display: block;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      margin-top: 28px;
      color: var(--text-muted);
      font-size: 0.72rem;
      text-align: center;
      opacity: 0.55;
      animation: fadeUp 0.7s ease 0.3s both;
    }

    /* ── Keyframes ──────────────────────────────────────────────── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.9); }
      60%  { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    .pop { animation: popIn 0.35s ease both; }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 18px; }
    }
  </style>
</head>

<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page">
    <!-- Header -->
    <header class="header">
      <div class="badge">
        <span class="dot"></span>
        Live Attendance
      </div>
      <h1>QR Attendance Scanner</h1>
      <p>Point the camera at an attendee's QR code to check them in.</p>
    </header>

    <!-- Card -->
    <main class="card" role="main">

      <!-- Scanner -->
      <div class="scanner-wrapper">
        <div class="scan-corners" aria-hidden="true">
          <span class="corner-bl"></span>
          <span class="corner-br"></span>
        </div>
        <div class="scan-line" id="scanLine" aria-hidden="true"></div>
        <div id="reader"></div>
      </div>

      <!-- Status -->
      <div class="divider">Status</div>
      <div class="status-banner" id="statusBanner" role="status" aria-live="polite">
        <span class="status-icon" id="statusIcon">📷</span>
        <span class="status-text">
          <span class="label" id="statusLabel">Awaiting</span>
          <span id="status">Ready to scan...</span>
        </span>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-chip">
          <span class="val" id="scanCount">0</span>
          <span class="lbl">Scanned</span>
        </div>
        <div class="stat-chip">
          <span class="val" id="errorCount">0</span>
          <span class="lbl">Errors</span>
        </div>
        <div class="stat-chip">
          <span class="val" id="sessionTime">00:00</span>
          <span class="lbl">Session</span>
        </div>
      </div>

    </main>

    <footer class="footer">
      &copy; 2025 QR Attendance System &mdash; All rights reserved
    </footer>
  </div>

  <script>
    /* ── Backend (unchanged) ──────────────────────────────────── */
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHNBpb_YZqUjq_pP4-OfHXSiv3uH2q24u5Pv-E0JE-pboFL5v_7QSHFrJczl7TAV5E3A/exec';
    let isScanning = true;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;

      setStatus('logging', '⏳', 'Logging', `Logging: ${decodedText}…`);
      startScanLine();

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendeeId: decodedText })
      })
        .then(() => {
          scanCount++;
          updateStats();
          setStatus('success', '✅', 'Checked In', decodedText);
          stopScanLine();
          setTimeout(() => {
            setStatus('', '📷', 'Awaiting', 'Ready to scan next…');
            isScanning = true;
          }, 2000); // 2-second cooldown to prevent double scans
        })
        .catch(err => {
          errorCount++;
          updateStats();
          setStatus('error', '❌', 'Error', 'Error logging attendance');
          stopScanLine();
          isScanning = true;
        });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);

    /* ── UI Helpers ───────────────────────────────────────────── */
    let scanCount  = 0;
    let errorCount = 0;
    let sessionStart = Date.now();

    function setStatus(type, icon, label, text) {
      const banner = document.getElementById('statusBanner');
      const iconEl  = document.getElementById('statusIcon');
      const labelEl = document.getElementById('statusLabel');
      const textEl  = document.getElementById('status');

      banner.className = 'status-banner pop ' + type;
      iconEl.textContent  = icon;
      labelEl.textContent = label;
      textEl.textContent  = text;

      // Remove pop class after animation so it can be re-triggered
      banner.addEventListener('animationend', () => banner.classList.remove('pop'), { once: true });
    }

    function startScanLine() {
      document.getElementById('scanLine').classList.add('active');
    }
    function stopScanLine() {
      document.getElementById('scanLine').classList.remove('active');
    }

    function updateStats() {
      document.getElementById('scanCount').textContent  = scanCount;
      document.getElementById('errorCount').textContent = errorCount;
    }

    // Session timer
    function updateSessionTime() {
      const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
      const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const ss = String(elapsed % 60).padStart(2, '0');
      document.getElementById('sessionTime').textContent = `${mm}:${ss}`;
    }
    setInterval(updateSessionTime, 1000);

    // Activate scan line while camera is live (observer trick)
    setTimeout(() => {
      const video = document.querySelector('#reader video');
      if (video) startScanLine();
    }, 2000);
  </script>
</body>

</html>
